<!DOCTYPE html>
<html lang="en">
<head>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f4f4f9;
            transition: background 0.3s, color 0.3s;
        }
        .dark-mode {
            background-color: #222;
            color: white;
        }
        #chat-box {
            width: 80%;
            max-width: 600px;
            margin: auto;
            border-radius: 10px;
            padding: 15px;
            height: 400px;
            overflow-y: scroll;
            background: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .user, .bot {
            margin: 8px 0;
            padding: 10px;
            border-radius: 10px;
            max-width: 75%;
            display: inline-block;
            clear: both;
        }
        .user {
            background-color: #0084ff;
            color: white;
            text-align: right;
            float: right;
        }
        .bot {
            background-color: #f6f1f1;
            text-align: left;
            float: left;
        }
        input, button {
            padding: 10px;
            margin-top: 10px;
            font-size: 16px;
        }
        input {
            width: 65%;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            border: none;
            cursor: pointer;
            background: #0084ff;
            color: white;
            border-radius: 5px;
        }
        button:hover {
            background: #006ecc;
        }
        .typing {
            font-style: italic;
            color: rgb(17, 16, 16);
        }
        .dark-mode .typing {
            color: #171616;
        }
        .toggle-mode {
            background: none;
            border: none;
            font-size: 14px;
            cursor: pointer;
            color: #0084ff;
        }
        .dark-mode #chat-box {
            background: #333;  /* Darker chat background */
            color: white;
        }

        .dark-mode .bot {
            background-color: #444; /* Dark background for bot */
            color: #fcfefe;  /* Bright cyan text for contrast */
        }

    </style>
</head>
<body>

    <h1>Mental Health Chatbot</h1>
    <button class="toggle-mode" onclick="toggleDarkMode()">🌙 Toggle Dark Mode</button>

    <div id="chat-box"></div>

    <input type="text" id="user-input" placeholder="Type a message..." onkeypress="checkEnter(event)">
    <button onclick="sendMessage()">Send</button>

    <script>
        function sendMessage() {
            let userMessage = document.getElementById("user-input").value;
            if (userMessage.trim() === "") return;

            let chatBox = document.getElementById("chat-box");
            chatBox.innerHTML += `<p class='user'><strong>You:</strong> ${userMessage}</p>`;
            document.getElementById("user-input").value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // Show typing effect
            let typingIndicator = document.createElement("p");
            typingIndicator.classList.add("typing");
            typingIndicator.innerHTML = "<strong>Bot:</strong> Typing...";
            chatBox.appendChild(typingIndicator);
            chatBox.scrollTop = chatBox.scrollHeight;

            setTimeout(() => {
                fetch("/chat", {
                    method: "POST",
                    body: JSON.stringify({ message: userMessage }),
                    headers: { "Content-Type": "application/json" }
                })
                .then(response => response.json())
                .then(data => {
                    chatBox.removeChild(typingIndicator);
                    chatBox.innerHTML += `<p class='bot'><strong>Bot:</strong> ${data.response}</p>`;
                    chatBox.scrollTop = chatBox.scrollHeight;
                });
            }, 1000); // Simulated delay for natural feel
        }

        function checkEnter(event) {
            if (event.key === "Enter") sendMessage();
        }

        function toggleDarkMode() {
            document.body.classList.toggle("dark-mode");
        }
    </script>

</body>
</html>
